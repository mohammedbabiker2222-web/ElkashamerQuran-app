<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمع للقرآن الكريم | قارئ</title>
    <!-- استدعاء خط عربي أنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1b1e;
            --card-bg: #132629;
            --accent-gold: #e5c158;
            --accent-gold-hover: #d4ae43;
            --text-light: #e0e6ed;
            --text-muted: #8a99a8;
            --border-gold: rgba(229, 193, 88, 0.3);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #152d32 0%, #081113 100%);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-card {
            background-color: transparent;
            max-width: 420px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
            letter-spacing: 1px;
        }

        .logo-title {
            font-family: 'Amiri', serif;
            font-size: 3.5rem;
            color: var(--accent-gold);
            margin: -10px 0 0 0;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(229, 193, 88, 0.2);
        }

        .description {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: -10px 0 10px 0;
        }

        .fav-btn {
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--accent-gold);
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .fav-btn:hover {
            background: rgba(229, 193, 88, 0.1);
        }

        .verse-box {
            margin: 25px 0;
            padding: 15px;
            width: 100%;
        }

        .verse-text {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            color: var(--accent-gold);
            line-height: 1.8;
            margin-bottom: 8px;
        }

        .verse-ref {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .controls-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        select {
            width: 100%;
            padding: 14px 18px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 30px;
            color: var(--text-light);
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
            text-align: center;
            cursor: pointer;
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 30px;
            display: none;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.8;
        }

        .designer-tag {
            color: var(--accent-gold);
            font-weight: 500;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="subtitle">استمع للقرآن الكريم</div>
    <h1 class="logo-title">قَـارِئ</h1>
    <div class="description">اختر قارئك، واسمع كتاب الله في أي مكان</div>

    <button class="fav-btn">
        <span>★</span> مفضلتي
    </button>

    <div class="verse-box">
        <div class="verse-text">﴿ إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ ﴾</div>
        <div class="verse-ref">سورة الحجر – ٩</div>
    </div>

    <div class="controls-wrapper">
        <select id="reciters">
            <option value="">...جاري تحميل قائمة القراء</option>
        </select>

        <select id="moshaf" disabled>
            <option value="">اختر الرواية / المصحف</option>
        </select>

        <select id="surahs" disabled>
            <option value="">اختر السورة</option>
        </select>

        <audio id="audioPlayer" controls></audio>
    </div>

    <footer>
     صدقة جارية لروح المغفور له بإذن الله محمد العتيبي له الرحمة  والمغفرة  والعتق من النار<br>
        <span class="designer-tag">تصميم: محمد بابكر الطيب © 2026</span>
    </footer>
</div>

<script>
    const recitersSelect = document.getElementById('reciters');
    const moshafSelect = document.getElementById('moshaf');
    const surahsSelect = document.getElementById('surahs');
    const audioPlayer = document.getElementById('audioPlayer');

    let recitersData = [];
    let surahsNames = [];

    // جلب قائمة السور والقراء
    fetch('https://mp3quran.net/api/v3/suwar?language=ar')
        .then(res => res.json())
        .then(data => {
            surahsNames = data.suwar;
            return fetch('https://mp3quran.net/api/v3/reciters?language=ar');
        })
        .then(res => res.json())
        .then(data => {
            recitersData = data.reciters;
            recitersSelect.innerHTML = '<option value="">اختر القارئ</option>';
            recitersData.forEach((r, index) => {
                recitersSelect.innerHTML += `<option value="${index}">${r.name}</option>`;
            });
        })
        .catch(err => {
            recitersSelect.innerHTML = '<option value="">حدث خطأ في تحميل البيانات</option>';
        });

    recitersSelect.addEventListener('change', (e) => {
        const reciterIndex = e.target.value;
        moshafSelect.disabled = true;
        surahsSelect.disabled = true;
        audioPlayer.style.display = 'none';

        if (reciterIndex === '') return;

        const reciter = recitersData[reciterIndex];
        moshafSelect.innerHTML = '<option value="">اختر الرواية / المصحف</option>';
        reciter.moshaf.forEach((m, index) => {
            moshafSelect.innerHTML += `<option value="${index}">${m.name}</option>`;
        });
        moshafSelect.disabled = false;
    });

    moshafSelect.addEventListener('change', (e) => {
        const reciterIndex = recitersSelect.value;
        const moshafIndex = e.target.value;
        surahsSelect.disabled = true;
        audioPlayer.style.display = 'none';

        if (moshafIndex === '') return;

        const moshaf = recitersData[reciterIndex].moshaf[moshafIndex];
        const availableSurahs = moshaf.surah_list.split(',');

        surahsSelect.innerHTML = '<option value="">اختر السورة</option>';
        availableSurahs.forEach(surahNum => {
            const surahId = parseInt(surahNum);
            const surahObj = surahsNames.find(s => s.id === surahId);
            const surahName = surahObj ? surahObj.name : `سورة ${surahNum}`;
            const formattedNum = surahNum.padStart(3, '0');
            const audioUrl = `${moshaf.server}${formattedNum}.mp3`;
            surahsSelect.innerHTML += `<option value="${audioUrl}">${surahId}. ${surahName}</option>`;
        });
        surahsSelect.disabled = false;
    });

    surahsSelect.addEventListener('change', (e) => {
        if (e.target.value) {
            audioPlayer.src = e.target.value;
            audioPlayer.style.display = 'block';
            audioPlayer.play();
        }
    });
</script>

</body>
</html>
