<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القرآن الكريم - المكتبة الصوتية الشاملة</title>
  <style>
    * { 
      box-sizing: border-box; 
    }

    /* ========================= خلفية الموقع ========================= */
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: 
        linear-gradient(rgba(3, 35, 25, 0.78), rgba(2, 28, 20, 0.88)),
        url('https://images.unsplash.com/photo-1584551246679-0daf3d275d0f?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat fixed;
      min-height: 100vh;
      margin: 0;
      padding: 15px 10px;
      color: #173b2d;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ========================= البطاقة الرئيسية ========================= */
    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 18px 20px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.3) inset;
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    /* ========================= لوحة التاريخ والوقت والصلاة ========================= */
    .datetime-box {
      background: linear-gradient(135deg, #064e3b, #047857);
      color: white;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      margin-bottom: 15px;
      box-shadow: 0 4px 12px rgba(4, 120, 87, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .clock-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .clock {
      font-size: 1.35rem;
      font-weight: bold;
      letter-spacing: 1px;
      direction: ltr;
      display: inline-block;
    }

    .period {
      font-size: 0.85rem;
      display: inline-block;
      opacity: 0.9;
    }

    /* قسم الصلاة التالية */
    .next-prayer-badge {
      margin-top: 6px;
      background: rgba(255, 255, 255, 0.15);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .prayer-title {
      font-weight: 600;
      color: #fef08a;
    }

    .prayer-countdown {
      font-size: 0.8rem;
      color: #d1fae5;
      font-weight: bold;
    }

    .dates-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.78rem;
    }

    .date-gregorian {
      font-weight: 600;
    }

    .date-hijri {
      color: #d1fae5;
    }

    /* ========================= العنوان ========================= */
    h2 {
      text-align: center;
      color: #064e3b;
      margin-top: 2px;
      margin-bottom: 16px;
      font-size: 1.25rem;
      line-height: 1.35;
      font-weight: 800;
    }

    .quran-icon {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 2px;
    }

    /* ========================= الحقول ========================= */
    .form-group {
      margin-bottom: 1rem;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      color: #064e3b;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 0.9rem;
      font-family: inherit;
      border: 1.5px solid #a7f3d0;
      background: #ffffff;
      color: #064e3b;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }

    .search-box {
      margin-bottom: 6px;
      background-color: #f0fdf4;
    }

    select[size] {
      height: 140px;
      overflow-y: auto;
      background-color: #ffffff;
    }

    option {
      padding: 8px 10px;
      text-align: right;
      border-bottom: 1px solid #f0fdf4;
      white-space: normal;
      word-wrap: break-word;
      border-radius: 4px;
    }

    option:hover, option:checked {
      background-color: #d1fae5 !important;
      color: #065f46;
      font-weight: 600;
    }

    /* ========================= قسم السورة والزر البني ========================= */
    .surah-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .surah-row select {
      flex: 1;
    }

    .play-btn-brown {
      background: linear-gradient(135deg, #78350f, #92400e);
      color: white;
      border: none;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 10px;
      white-space: nowrap;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(120, 53, 15, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 42px;
    }

    .play-btn-brown:hover {
      background: linear-gradient(135deg, #92400e, #b45309);
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(120, 53, 15, 0.4);
    }

    .play-btn-brown:active {
      transform: translateY(0);
    }

    /* ========================= المشغل ========================= */
    audio {
      width: 100%;
      margin-top: 14px;
      border-radius: 8px;
    }

    .count-badge {
      font-size: 0.75rem;
      color: #059669;
      background: #ecfdf5;
      padding: 2px 6px;
      border-radius: 10px;
      float: left;
      font-weight: normal;
    }

    /* ========================= الصدقة الجارية ========================= */
    .charity-footer {
      margin-top: 18px;
      padding: 12px;
      border: 1px dashed #a7f3d0;
      text-align: center;
      background: linear-gradient(135deg, #f0fdf4, #e6f4ea);
      border-radius: 12px;
    }

    .charity-title {
      margin: 0;
      font-weight: bold;
      color: #064e3b;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .charity-sub {
      margin: 5px 0 0;
      font-size: 0.78rem;
      color: #047857;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px 6px;
      }
      .card {
        padding: 14px 12px;
        border-radius: 16px;
      }
      .clock {
        font-size: 1.2rem;
      }
      h2 {
        font-size: 1.15rem;
      }
      .dates-container {
        flex-direction: column;
        gap: 2px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- ========================= التاريخ والوقت والصلاة ========================= -->
    <div class="datetime-box">
      <div class="clock-row">
        <span class="clock" id="clock">00:00:00</span>
        <span class="period" id="period">صباحًا</span>
      </div>

      <!-- عرض الصلاة التالية بتوقيت الرياض -->
      <div class="next-prayer-badge">
        <span id="nextPrayerName" class="prayer-title">🕌 جاري تحميل الصلاة...</span>
        <span id="prayerCountdown" class="prayer-countdown">--:--:--</span>
      </div>

      <div class="dates-container">
        <span class="date-gregorian" id="gregorianDate">جاري التحميل...</span>
        <span class="date-hijri" id="hijriDate">جاري التحميل...</span>
      </div>
    </div>

    <!-- ========================= عنوان المكتبة ========================= -->
    <h2>
      <span class="quran-icon">📖</span>
      المكتبة الصوتية الشاملة
    </h2>

    <!-- ========================= البحث واختيار القارئ ========================= -->
    <div class="form-group">
      <label for="searchInput">
        البحث عن قارئ:
        <span id="reciterCount" class="count-badge">جاري التحميل...</span>
      </label>
      <input 
        type="text" 
        id="searchInput" 
        class="search-box" 
        placeholder="اكتب اسم القارئ (مثال: العفاسي، المعيقلي)..." 
        oninput="filterReciters()"
      >
      <select id="reciterSelect" size="5">
        <option>جاري جلب كافة القراء من خادم MP3Quran...</option>
      </select>
    </div>

    <!-- ========================= اختيار السورة والزر البني ========================= -->
    <div class="form-group">
      <label for="chapterSelect">اختر السورة:</label>
      <div class="surah-row">
        <button class="play-btn-brown" onclick="playRecitation()">▶ تشغيل</button>
        <select id="chapterSelect">
          <option value="">جاري تحميل السور...</option>
        </select>
      </div>
    </div>

    <!-- ========================= مشغل الصوت ========================= -->
    <audio id="audioPlayer" controls style="display: none;"></audio>

    <!-- ========================= الصدقة الجارية ========================= -->
    <div class="charity-footer">
      <p class="charity-title">
        صدقة جارية عن روح الوالد <br>
        بابكر الطيب محمد علي <br>
        <span style="font-weight: normal; font-size: 0.8rem;">(طيب الله ثراه وجعل الجنة مثواه)</span>
      </p>
      <p class="charity-sub">
        اللهم اجعل القرآن الكريم ربيع قلبه ونوراً له في قبره وارأف به وارحمه.
      </p>
    </div>
  </div>

  <script>
    /* =====================================================
       تحديث الساعة والتاريخ
    ===================================================== */
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const period = hours >= 12 ? "مساءً" : "صباحًا";
      hours = hours % 12 || 12;
      hours = String(hours).padStart(2, '0');

      document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds}`;
      document.getElementById("period").textContent = period;

      const gregorian = now.toLocaleDateString("ar-SA", {
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "numeric"
      });
      document.getElementById("gregorianDate").textContent = gregorian;

      const hijri = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", {
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "numeric"
      }).format(now);
      document.getElementById("hijriDate").textContent = hijri;
    }

    setInterval(updateClock, 1000);
    updateClock();

    /* =====================================================
       جلب مواقيت الصلاة لمدينة الرياض (تقويم أم القرى - Aladhan API)
    ===================================================== */
    let todayPrayersList = [];
    const prayerNamesAr = {
      Fajr: "الفجر",
      Dhuhr: "الظهر",
      Asr: "العصر",
      Maghrib: "المغرب",
      Isha: "العشاء"
    };

    async function fetchPrayerTimes() {
      try {
        // طريقة أم القرى (method=4) لمدينة الرياض
        const res = await fetch("https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=Saudi%20Arabia&method=4");
        const data = await res.json();
        const timings = data.data.timings;

        const mainPrayers = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
        const now = new Date();

        todayPrayersList = mainPrayers.map(key => {
          const [h, m] = timings[key].split(":");
          const pTime = new Date(now);
          pTime.setHours(parseInt(h), parseInt(m), 0, 0);
          return {
            nameKey: key,
            nameAr: prayerNamesAr[key],
            time: pTime,
            timeStr: timings[key]
          };
        });

        updateNextPrayer();
      } catch (err) {
        document.getElementById("nextPrayerName").textContent = "🕌 فشل جلب المواقيت";
      }
    }

    function formatTime12(date) {
      let hours = date.getHours();
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const period = hours >= 12 ? "م" : "ص";
      hours = hours % 12 || 12;
      return `${hours}:${minutes} ${period}`;
    }

    function updateNextPrayer() {
      if (todayPrayersList.length === 0) return;

      const now = new Date();
      let next = todayPrayersList.find(p => p.time > now);

      if (!next) {
        // إذا انتهت صلوات اليوم، فالصلاة القادمة هي الفجر
        const fajrTime = new Date(todayPrayersList[0].time);
        fajrTime.setDate(fajrTime.getDate() + 1);
        next = {
          nameAr: prayerNamesAr["Fajr"],
          time: fajrTime
        };
      }

      const diffMs = next.time - now;
      const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
      const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      const diffSecs = Math.floor((diffMs % (1000 * 60)) / 1000);

      document.getElementById("nextPrayerName").textContent = `🕌 ${next.nameAr} بالرياض: ${formatTime12(next.time)}`;
      document.getElementById("prayerCountdown").textContent = `متبقي ${String(diffHrs).padStart(2, '0')}:${String(diffMins).padStart(2, '0')}:${String(diffSecs).padStart(2, '0')}`;
    }

    fetchPrayerTimes();
    setInterval(updateNextPrayer, 1000);

    /* =====================================================
       MP3QURAN API
    ===================================================== */
    const MP3QURAN_API = "https://mp3quran.net/api/v3/reciters?language=ar";
    let allReciters = [];

    const surahs = [
      "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
      "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
      "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
      "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
      "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
      "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
      "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
      "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
      "التكوير", "الإنفطار", "المطففين", "الإنشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
      "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
      "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر",
      "المسد", "الإخلاص", "الفلق", "الناس"
    ];

    function loadSurahs() {
      const select = document.getElementById("chapterSelect");
      select.innerHTML = "";
      surahs.forEach((name, index) => {
        const option = document.createElement("option");
        option.value = index + 1;
        option.textContent = `${index + 1}. سورة ${name}`;
        select.appendChild(option);
      });
    }

    async function loadReciters() {
      try {
        const res = await fetch(MP3QURAN_API);
        const data = await res.json();
        allReciters = data.reciters || [];
        renderReciters(allReciters);
      } catch (err) {
        document.getElementById("reciterSelect").innerHTML = "<option disabled>فشل تحميل القراء، يرجى التحقق من الاتصال</option>";
      }
    }

    function renderReciters(list) {
      const select = document.getElementById("reciterSelect");
      const countBadge = document.getElementById("reciterCount");
      select.innerHTML = "";
      countBadge.textContent = `${list.length} قارئ`;

      if (list.length === 0) {
        select.innerHTML = "<option disabled>لا يوجد قارئ بهذا الاسم</option>";
        return;
      }

      list.forEach((r, index) => {
        const option = document.createElement("option");
        option.value = r.id;
        const rewaya = r.moshaf && r.moshaf[0] ? ` (${r.moshaf[0].name})` : "";
        option.textContent = r.name + rewaya;
        if (index === 0) {
          option.selected = true;
        }
        select.appendChild(option);
      });
    }

    function filterReciters() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const filtered = allReciters.filter(r => r.name.toLowerCase().includes(query));
      renderReciters(filtered);
    }

    function playRecitation() {
      const reciterId = document.getElementById("reciterSelect").value;
      const chapterId = parseInt(document.getElementById("chapterSelect").value);
      const player = document.getElementById("audioPlayer");

      const reciter = allReciters.find(r => r.id == reciterId);

      if (!reciter || !reciter.moshaf || reciter.moshaf.length === 0) {
        alert("التلاوة غير متوفرة لهذا القارئ.");
        return;
      }

      const moshaf = reciter.moshaf[0];
      const server = moshaf.server;
      const suraList = moshaf.surah_list.split(",").map(Number);

      if (!suraList.includes(chapterId)) {
        alert("عذراً، هذه السورة غير متوفرة بصوت القارئ المحدد.");
        return;
      }

      const paddedChapter = String(chapterId).padStart(3, "0");
      const audioUrl = `${server}${paddedChapter}.mp3`;

      player.src = audioUrl;
      player.style.display = "block";
      player.play();
    }

    loadSurahs();
    loadReciters();
  </script>
</body>
</html>
