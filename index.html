<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة القرآن الكريم</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d3b2e;
            background-image: radial-gradient(circle, #124d3c 0%, #08261e 100%);
            color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
            padding-bottom: 100px;
        }
        .hero-section, .sadaqah-section, .player-section, .list-section {
            text-align: center;
            border: 1px solid rgba(243, 201, 105, 0.3);
            border-radius: 15px;
            padding: 20px 15px;
            margin-bottom: 20px;
            background-color: rgba(0, 0, 0, 0.2);
        }
        .main-title {
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: #f3c969;
            margin: 10px 0;
            text-shadow: 0px 4px 15px rgba(243, 201, 105, 0.4);
        }
        .quran-verse {
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            color: #e6b85c;
            margin-bottom: 15px;
        }
        .sadaqah-title {
            color: #f3c969;
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
        }
        .father-name {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: #f3c969;
            margin: 10px 0;
            font-weight: 700;
        }
        .search-box {
            display: flex;
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            padding: 5px;
            margin-bottom: 20px;
        }
        .search-input {
            flex-grow: 1;
            border: none;
            padding: 10px;
            font-family: 'Tajawal', sans-serif;
            outline: none;
        }
        .clear-btn {
            background-color: #e8f0eb;
            border: none;
            border-radius: 8px;
            padding: 0 15px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }
        .readers-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .reader-btn {
            background-color: transparent;
            border: 1px solid #f3c969;
            color: #f3c969;
            padding: 8px 12px;
            border-radius: 20px;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }
        .reader-btn:hover, .reader-btn.active {
            background-color: #f3c969;
            color: #0d3b2e;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            margin-bottom: 15px;
            border: 1px solid #f3c969;
            background-color: #124d3c;
            color: white;
            outline: none;
        }
        .audio-player {
            width: 100%;
            margin-top: 15px;
            border-radius: 30px;
        }
        #loading {
            display: none;
            color: #f3c969;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="hero-section">
            <h1 class="main-title">مكتبة القرآن الكريم</h1>
            <h2 class="quran-verse">﴿ وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا ﴾</h2>
            <p>استمع إلى تلاوات عطرة بأصوات قراء القرآن الكريم</p>
        </div>

        <div class="sadaqah-section">
            <h3 class="sadaqah-title">❁ مكتبة التلاوات القرآنية ❁</h3>
            <p style="color: #c4c4c4;">صدقة جارية لروح والدي</p>
            <h2 class="father-name">بابكر الطيب محمد علي</h2>
            <p style="color: #c4c4c4; font-size: 0.9rem;">نسأل الله أن يتقبلها وينفعه بها.</p>
        </div>

        <div class="list-section">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن القارئ (مثال: السديس)">
                <button class="clear-btn" id="clearBtn">مسح</button>
            </div>

            <p style="color: #f3c969; font-size: 0.9rem; text-align: center;">★ الأكثر بحثًا</p>
            <div class="readers-grid">
                <button class="reader-btn" onclick="searchFor('عبدالرحمن السديس')">السديس</button>
                <button class="reader-btn" onclick="searchFor('ماهر المعيقلي')">المعيقلي</button>
                <button class="reader-btn" onclick="searchFor('ياسر الدوسري')">الدوسري</button>
                <button class="reader-btn" onclick="searchFor('عبدالباسط')">عبدالباسط</button>
                <button class="reader-btn" onclick="searchFor('المنشاوي')">المنشاوي</button>
            </div>

            <div id="loading">جاري تحميل البيانات...</div>

            <select id="reciterSelect">
                <option value="">-- اختر القارئ --</option>
            </select>

            <select id="surahSelect" disabled>
                <option value="">-- اختر السورة --</option>
            </select>
        </div>

        <div class="player-section">
            <h3 style="color:#f3c969; margin-top:0;">المشغل الصوتي</h3>
            <audio id="audioPlayer" class="audio-player" controls>
                متصفحك لا يدعم مشغل الصوت.
            </audio>
        </div>

    </div>

    <script>
        const reciterSelect = document.getElementById('reciterSelect');
        const surahSelect = document.getElementById('surahSelect');
        const audioPlayer = document.getElementById('audioPlayer');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');

        let allReciters = [];

        // جلب قائمة القراء من API
        async function fetchReciters() {
            loading.style.display = 'block';
            try {
                const response = await fetch('https://www.mp3quran.net/api/v3/reciters?language=ar');
                const data = await response.json();
                allReciters = data.reciters;
                populateReciters(allReciters);
            } catch (error) {
                console.error('خطأ في جلب القراء:', error);
                reciterSelect.innerHTML = '<option>حدث خطأ في الاتصال</option>';
            }
            loading.style.display = 'none';
        }

        // تعبئة قائمة القراء
        function populateReciters(reciters) {
            reciterSelect.innerHTML = '<option value="">-- اختر القارئ --</option>';
            reciters.forEach(reciter => {
                const option = document.createElement('option');
                option.value = reciter.id;
                option.textContent = reciter.name;
                reciterSelect.appendChild(option);
            });
        }

        // البحث
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.trim();
            const filtered = allReciters.filter(r => r.name.includes(term));
            populateReciters(filtered);
            surahSelect.innerHTML = '<option value="">-- اختر السورة --</option>';
            surahSelect.disabled = true;
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            populateReciters(allReciters);
            surahSelect.innerHTML = '<option value="">-- اختر السورة --</option>';
            surahSelect.disabled = true;
            audioPlayer.src = "";
        });

        // اختيار سريع من الأزرار
        window.searchFor = function(name) {
            searchInput.value = name;
            const filtered = allReciters.filter(r => r.name.includes(name));
            populateReciters(filtered);
            if(filtered.length > 0) {
                reciterSelect.value = filtered[0].id;
                fetchSurahs(filtered[0].id);
            }
        };

        // عند اختيار قارئ
        reciterSelect.addEventListener('change', (e) => {
            const reciterId = e.target.value;
            if (reciterId) {
                fetchSurahs(reciterId);
            } else {
                surahSelect.innerHTML = '<option value="">-- اختر السورة --</option>';
                surahSelect.disabled = true;
            }
        });

        // جلب السور الخاصة بالقارئ
        async function fetchSurahs(reciterId) {
            loading.style.display = 'block';
            surahSelect.disabled = true;
            try {
                const reciter = allReciters.find(r => r.id == reciterId);
                const moshaf = reciter.moshaf[0]; // نأخذ المصحف الافتراضي للقارئ
                const server = moshaf.server;
                const surahList = moshaf.surah_list.split(',');

                // جلب أسماء السور
                const suwarResponse = await fetch('https://www.mp3quran.net/api/v3/suwar?language=ar');
                const suwarData = await suwarResponse.json();
                
                surahSelect.innerHTML = '<option value="">-- اختر السورة --</option>';
                
                surahList.forEach(surahId => {
                    const surahInfo = suwarData.suwar.find(s => s.id == surahId);
                    if (surahInfo) {
                        const option = document.createElement('option');
                        // تنسيق رقم السورة ليكون 3 أرقام (مثال: 001) لتكوين الرابط الصحيح
                        const formattedId = surahId.padStart(3, '0');
                        option.value = `${server}${formattedId}.mp3`;
                        option.textContent = surahInfo.name;
                        surahSelect.appendChild(option);
                    }
                });
                surahSelect.disabled = false;
            } catch (error) {
                console.error('خطأ في جلب السور:', error);
            }
            loading.style.display = 'none';
        }

        // تشغيل السورة عند اختيارها
        surahSelect.addEventListener('change', (e) => {
            const audioUrl = e.target.value;
            if (audioUrl) {
                audioPlayer.src = audioUrl;
                audioPlayer.play();
            } else {
                audioPlayer.pause();
                audioPlayer.src = "";
            }
        });

        // تهيئة التطبيق
        window.onload = fetchReciters;
    </script>
</body>
</html>
