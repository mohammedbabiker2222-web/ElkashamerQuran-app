<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلاوات القرآن الكريم - صدقة جارية</title>
    <style>
        :root {
            --primary-color: #1b5e20;
            --primary-hover: #2e7d32;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --muted-color: #616161;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.6rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        input, select, button {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(27, 94, 32, 0.1);
        }

        .search-box {
            background-color: #fafafa;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        audio {
            width: 100%;
            margin-top: 1.5rem;
            border-radius: 8px;
        }

        .count-badge {
            font-size: 0.8rem;
            color: var(--muted-color);
            float: left;
            font-weight: normal;
        }

        /* تنسيق قسم الصدقة الجارية */
        .dedication-box {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px border-dash #e0e0e0;
            border-top-style: dashed;
            text-align: center;
            background-color: #f9fbe7;
            padding: 1rem;
            border-radius: 8px;
        }

        .dedication-title {
            margin: 0;
            font-weight: bold;
            color: #1b5e20;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .dedication-sub {
            margin: 6px 0 0 0;
            font-size: 0.85rem;
            color: #558b2f;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>القرآن الكريم - المكتبة الصوتية</h2>
    
    <!-- البحث واختيار القارئ -->
    <div class="form-group">
        <label for="searchInput">
            البحث عن قارئ:
            <span id="reciterCount" class="count-badge"></span>
        </label>
        <input 
            type="text" 
            id="searchInput" 
            class="search-box" 
            placeholder="اكتب اسم القارئ (مثال: العفاسي، المعيقلي)..."
            oninput="filterReciters()"
        >
        
        <select id="reciterSelect" size="4" style="margin-top: 6px;">
            <option>جاري تحميل قائمة القراء...</option>
        </select>
    </div>

    <!-- اختيار السورة -->
    <div class="form-group">
        <label for="chapterSelect">اختر السورة:</label>
        <select id="chapterSelect">
            <!-- يتم تعبئة السور تلقائياً عبر JavaScript -->
        </select>
    </div>

    <button onclick="playRecitation()">تشغيل التلاوة</button>

    <!-- مشغل الصوت -->
    <audio id="audioPlayer" controls style="display: none;"></audio>

    <!-- إهداء الصدقة الجارية -->
    <div class="dedication-box">
        <p class="dedication-title">
            صدقة جارية عن روح الوالد / بابكر الطيب محمد علي
            <br>
            <span style="font-weight: normal; font-size: 0.85rem;">(طيب الله ثراه وجعل الجنة مثواه)</span>
        </p>
        <p class="dedication-sub">
            اللهم اجعل القرآن الكريم ربيع قلبه ونوراً له في قبره ورأفةً ورحمه.
        </p>
    </div>
</div>

<script>
    const BASE_URL = 'https://api.quran.com/api/v4';
    let allReciters = [];

    // أسماء سور القرآن الكريم الـ 114
    const surahs = [
        "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
        "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
        "الأنبياء", "الحج", "المؤمنون", "النُور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
        "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
        "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
        "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
        "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
        "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
        "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
        "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
        "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "المواعون", "الكوثر", "الكافرون", "النصر",
        "المسد", "الإخلاص", "الفلق", "الناس"
    ];

    // 1. تعبئة قائمة السور
    function loadSurahs() {
        const select = document.getElementById('chapterSelect');
        select.innerHTML = '';
        surahs.forEach((name, index) => {
            const option = document.createElement('option');
            option.value = index + 1; // رقم السورة من 1 إلى 114
            option.textContent = `${index + 1}. سورة ${name}`;
            select.appendChild(option);
        });
    }

    // 2. جلب قائمة القراء
    async function loadReciters() {
        const select = document.getElementById('reciterSelect');
        try {
            const res = await fetch(`${BASE_URL}/resources/recitations`);
            const data = await res.json();
            
            allReciters = data.recitations || [];
            renderReciters(allReciters);
        } catch (err) {
            select.innerHTML = '<option disabled>فشل تحميل قائمة القراء</option>';
        }
    }

    // 3. عرض القراء
    function renderReciters(list) {
        const select = document.getElementById('reciterSelect');
        const countBadge = document.getElementById('reciterCount');
        select.innerHTML = '';

        countBadge.textContent = `${list.length} قارئ`;

        if (list.length === 0) {
            select.innerHTML = '<option disabled>لا يوجد قارئ بهذا الاسم</option>';
            return;
        }

        list.forEach((r, index) => {
            const option = document.createElement('option');
            option.value = r.id;
            option.textContent = `${r.reciter_name} ${r.style ? '(' + r.style + ')' : ''}`;
            if (index === 0) option.selected = true; 
            select.appendChild(option);
        });
    }

    // 4. تصفية القراء بالبحث
    function filterReciters() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = allReciters.filter(r => 
            r.reciter_name.toLowerCase().includes(query)
        );
        renderReciters(filtered);
    }

    // 5. جلب الصوت وتشغيله
    async function playRecitation() {
        const reciterId = document.getElementById('reciterSelect').value;
        const chapterId = document.getElementById('chapterSelect').value;
        const player = document.getElementById('audioPlayer');

        if (!reciterId) {
            alert('يرجى اختيار قارئ من القائمة.');
            return;
        }

        try {
            const res = await fetch(`${BASE_URL}/chapter_recitations/${reciterId}/${chapterId}`);
            const data = await res.json();
            
            if (data.audio_file && data.audio_file.audio_url) {
                player.src = data.audio_file.audio_url;
                player.style.display = 'block';
                player.play();
            } else {
                alert('التلاوة غير متوفرة لهذا القارئ والسورة.');
            }
        } catch (err) {
            alert('حدث خطأ أثناء الاتصال بالخادم.');
        }
    }

    // تشغيل الإعدادات الأولية
    loadSurahs();
    loadReciters();
</script>

</body>
</html>
