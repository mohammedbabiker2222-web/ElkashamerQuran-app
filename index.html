<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - المكتبة الصوتية</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            text-align: center;
            color: #1b4332;
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #2d6a4f;
        }
        input, select, button {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d8f3dc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2d6a4f;
            box-shadow: 0 0 0 2px rgba(45, 106, 79, 0.2);
        }
        .search-box {
            margin-bottom: 0.5rem;
            background-color: #f8f9fa;
        }
        select[size] {
            height: auto;
            max-height: 180px;
        }
        option {
            padding: 8px 10px;
            text-align: right;
        }
        button {
            background-color: #1b4332;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
            padding: 0.85rem;
            border-radius: 8px;
        }
        button:hover {
            background-color: #2d6a4f;
        }
        audio {
            width: 100%;
            margin-top: 1.5rem;
            border-radius: 8px;
        }
        .count-badge {
            font-size: 0.8rem;
            color: #7f8c8d;
            float: left;
        }
        .charity-footer {
            margin-top: 2rem;
            padding: 1rem;
            border: 1px dashed #b7e4c7;
            text-align: center;
            background-color: #f7fad7;
            border-radius: 8px;
        }
        .charity-title {
            margin: 0;
            font-weight: bold;
            color: #1b4332;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .charity-sub {
            margin: 6px 0 0 0;
            font-size: 0.85rem;
            color: #40916c;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>القرآن الكريم - المكتبة الصوتية</h2>
    
    <!-- قسم البحث واختيار القارئ -->
    <div class="form-group">
        <label for="searchInput">
            البحث عن قارئ:
            <span id="reciterCount" class="count-badge"></span>
        </label>
        <input 
            type="text" 
            id="searchInput" 
            class="search-box" 
            placeholder="اكتب اسم القارئ (مثال: العفاسي، المعيقلي)..."
            oninput="filterReciters()"
        >
        
        <select id="reciterSelect" size="5">
            <option>جاري تحميل قائمة القراء بالعربية...</option>
        </select>
    </div>

    <!-- قسم اختيار السورة -->
    <div class="form-group">
        <label for="chapterSelect">اختر السورة:</label>
        <select id="chapterSelect">
            <option value="">جاري تحميل السور...</option>
        </select>
    </div>

    <!-- زر التشغيل والمشغل الصوتي -->
    <button onclick="playRecitation()">تشغيل التلاوة</button>
    <audio id="audioPlayer" controls style="display: none;"></audio>

    <!-- إهداء الصدقة الجارية -->
    <div class="charity-footer">
        <p class="charity-title">
            صدقة جارية عن روح الوالد / بابكر الطيب محمد علي
            <br>
            <span style="font-weight: normal; font-size: 0.85rem;">(طيب الله ثراه وجعل الجنة مثواه)</span>
        </p>
        <p class="charity-sub">
            اللهم اجعل القرآن الكريم ربيع قلبه ونوراً له في قبره وارأف به وارحمه.
        </p>
    </div>
</div>
